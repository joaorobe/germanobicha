<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Modelo CNN</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #2c3e50; }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            display: none;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f5f5f5; }
        
        .acertou { color: #27ae60; font-weight: bold; }
        .errou { color: #e74c3c; font-weight: bold; }
        
        #statusInfo { font-size: 1.2em; font-weight: bold; margin-bottom: 20px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>Validação do Dataset de Teste</h2>
    <p style="color: #7f8c8d;">O Node.js irá vasculhar a pasta <b>test</b> e avaliar todas as imagens automaticamente.</p>
    
    <button id="startBtn" onclick="runBatchTest()">🚀 Iniciar Teste Automático</button>

    <div id="statusInfo"></div>

    <table id="resultsTable">
        <thead>
            <tr>
                <th>Arquivo</th>
                <th>A IA Previu</th>
                <th>Confiança</th>
                <th>Resultado</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    async function runBatchTest() {
        const btn = document.getElementById('startBtn');
        const statusInfo = document.getElementById('statusInfo');
        const table = document.getElementById('resultsTable');
        const tbody = document.getElementById('tableBody');

        btn.disabled = true;
        btn.innerText = 'Processando no Servidor...';
        statusInfo.innerText = 'Por favor, aguarde. O Node.js está rodando o PyTorch...';
        table.style.display = 'none';
        tbody.innerHTML = '';

        try {
            const response = await fetch('http://localhost:3000/test-batch');
            const data = await response.json();

            if (data.ok) {
                let acertos = 0;

                data.results.forEach(item => {
                    const tr = document.createElement('tr');
                    
                    const isCorrect = item.realClass === item.predictedClass;
                    if (isCorrect) acertos++;

                    tr.innerHTML = `
                        <td>${item.file}</td>
                        <td style="text-transform: uppercase;">${item.predictedClass}</td>
                        <td>${(item.confidence * 100).toFixed(1)}%</td>
                        <td class="${isCorrect ? 'acertou' : 'errou'}">${isCorrect ? '✔ ACERTOU' : '❌ ERROU'}</td>
                    `;
                    tbody.appendChild(tr);
                });

                const total = data.results.length;
                statusInfo.innerHTML = `<span style="color: #27ae60;">Concluído! A IA acertou ${acertos} de ${total} imagens (${((acertos/total)*100).toFixed(1)}%).</span>`;
                table.style.display = 'table';
            } else {
                throw new Error(data.error);
            }
        } catch (error) {
            statusInfo.innerHTML = `<span style="color: #e74c3c;">Erro: ${error.message}</span>`;
        } finally {
            btn.disabled = false;
            btn.innerText = 'Rodar Novamente';
        }
    }
</script>

</body>
</html>
